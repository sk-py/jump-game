<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cartoon Runner</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#1d1b2e;font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif}
  #wrap{width:min(96vw,900px);border:5px solid #2b2b3a;border-radius:22px;overflow:hidden;box-shadow:0 8px 0 #0e0d18}
  canvas{display:block;width:100%;height:auto}
  #jump{font:inherit;font-size:1.6rem;font-weight:700;color:#fff;background:#ff6b6b;border:5px solid #2b2b3a;border-radius:18px;padding:14px 56px;cursor:pointer;box-shadow:0 7px 0 #2b2b3a;user-select:none;touch-action:manipulation}
  #jump:active{transform:translateY(5px);box-shadow:0 2px 0 #2b2b3a}
  small{color:#9a97b8}
  #mute{font:inherit;font-size:1rem;color:#fff;background:#4b4870;border:3px solid #2b2b3a;border-radius:12px;padding:6px 16px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="900" height="400"></canvas></div>
<button id="jump">JUMP</button>
<button id="mute">🔊 Sound on</button>
<small>Button, Space or ↑ to jump · M to mute</small>

<script>
// ====== CONFIG: set your player image path here ======
const PLAYER_IMG_SRC = "./dummy-image.png";   // e.g. "player.png" or "images/me.png" (relative to this HTML file)
// =====================================================

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 900, H = 400, GY = 330, INK = '#2b2b3a';
const P = { x: 90, y: GY - 64, w: 64, h: 64, vy: 0, onGround: true };

const img = new Image(); let imgOK = false;
if (PLAYER_IMG_SRC) { img.onload = () => imgOK = true; img.src = PLAYER_IMG_SRC; }

let state = 'ready', speed, score, hi = 0, obstacles, nextGap, clouds, t = 0, cycle = 0, groundX = 0;
let gate = null, gatePassed = false, runCP = 0, dodged = 0, newRec = false, parts = [], toasts = [], banner = 0;
try { hi = +localStorage.getItem('runnerHi') || 0; } catch (e) {}

clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 200 + Math.random() * 100, y: 40 + Math.random() * 90, s: 0.7 + Math.random() * 0.7 }));

function reset() {
  speed = 6; score = 0; obstacles = []; nextGap = 60;
  gate = null; gatePassed = false; runCP = Math.floor(hi); dodged = 0; parts = []; banner = 0; newRec = false;
  P.y = GY - P.h; P.vy = 0; P.onGround = true; state = 'play';
}

function jump() {
  ac();
  if (state !== 'play') { reset(); return; }
  if (P.onGround) { P.vy = -15.5; P.onGround = false; sfxJump(); unlock('jump'); }
}

document.getElementById('jump').addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) jump(); }
});

// ---------- sound (synthesized, no files needed) ----------
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol = 0.2, delay = 0, vib = 0) {
  const a = ac(); if (!a || muted) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  if (vib) { const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = vib; lg.gain.value = f0 * 0.08; l.connect(lg); lg.connect(o.frequency); l.start(t0); l.stop(t0 + dur); }
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfxJump = () => { tone('sine', 220, 640, 0.28, 0.28, 0, 22); tone('triangle', 440, 960, 0.18, 0.1); };           // boing!
const sfxLose = () => {                                                                                               // bonk + sad trombone
  tone('square', 220, 60, 0.14, 0.2);
  tone('sawtooth', 392, 380, 0.3, 0.14, 0.2); tone('sawtooth', 370, 360, 0.3, 0.14, 0.52);
  tone('sawtooth', 349, 340, 0.3, 0.14, 0.84); tone('sawtooth', 330, 140, 0.9, 0.14, 1.16, 6);
};
const sfxWin = () => {                                                                                                // fanfare + party horn
  [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.14, 0.12, i * 0.1));
  [523, 659, 784, 1047].forEach(f => tone('triangle', f, f, 0.7, 0.14, 0.45));
  tone('sawtooth', 300, 1400, 0.35, 0.08, 0.45); tone('sawtooth', 300, 1400, 0.35, 0.08, 0.85);
};
const sfxAch = () => { tone('sine', 880, 1760, 0.15, 0.2, 0.3); tone('sine', 1320, 1320, 0.35, 0.15, 0.42); };
const sfxBlip = () => { tone('square', 880, 880, 0.07, 0.07); tone('square', 1320, 1320, 0.09, 0.07, 0.08); };

const mb = document.getElementById('mute');
function toggleMute() { muted = !muted; mb.textContent = muted ? '🔇 Sound off' : '🔊 Sound on'; }
mb.addEventListener('click', () => { toggleMute(); mb.blur(); });
addEventListener('keydown', e => { if (e.code === 'KeyM') toggleMute(); });

// ---------- achievements ----------
const ACH = {
  jump: ['First Boing', 'Jump for the first time'], s100: ['Warming Up', 'Reach 100'],
  s300: ['Cactus Whisperer', 'Reach 300'], s600: ['Unstoppable', 'Reach 600'],
  dodge15: ['Dodge Master', 'Dodge 15 obstacles in one run'], gate: ['Checkpoint Crusher', 'Pass your previous best'],
  oops: ['Speedrun to Failure', 'Crash before reaching 10']
};
let got = {}; try { got = JSON.parse(localStorage.getItem('runnerAch') || '{}'); } catch (e) {}
function unlock(k) {
  if (got[k]) return; got[k] = 1;
  try { localStorage.setItem('runnerAch', JSON.stringify(got)); } catch (e) {}
  toasts.push({ txt: ACH[k][0] + ' — ' + ACH[k][1], life: 190 }); sfxAch();
}
function checkScore() { if (score >= 100) unlock('s100'); if (score >= 300) unlock('s300'); if (score >= 600) unlock('s600'); }

// ---------- celebration fx ----------
function celebrate(cx) {
  sfxWin(); unlock('gate'); banner = 160;
  const cols = ['#ff6b6b', '#ffd93d', '#4cc36b', '#4fb3ff', '#c77dff', '#fff'];
  for (let i = 0; i < 150; i++) parts.push({ x: cx + (Math.random() - 0.5) * 120, y: GY - 235, vx: (Math.random() - 0.5) * 10, vy: -4 - Math.random() * 9, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: cols[i % 6], life: 90 + Math.random() * 60 });
}
function stepFx() {
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.r += p.vr; p.life--; });
  parts = parts.filter(p => p.life > 0);
  if (banner > 0) banner--;
  if (toasts.length && --toasts[0].life <= 0) toasts.shift();
}
function drawFx() {
  parts.forEach(p => { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-5, -3, 10, 6); ctx.restore(); });
  if (banner > 0) {
    const k = 1 + Math.sin(t * 0.3) * 0.04; ctx.save(); ctx.translate(W / 2, 130); ctx.scale(k, k);
    text('CHECKPOINT CLEARED!', 0, 0, 42, '#ffd93d'); text('New territory. Keep going!', 0, 38, 20); ctx.restore();
  }
  if (toasts.length) {
    const a = toasts[0], w = Math.min(560, a.txt.length * 10.5 + 60);
    ctx.fillStyle = '#fff'; rr(16, 12, w, 40, 14); ctx.fill(); stroke(4);
    ctx.fillStyle = INK; ctx.font = '700 16px "Comic Sans MS",system-ui,sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('🏆 ' + a.txt, 30, 38);
  }
}
function drawGate(g) {
  const x = g.x, top = GY - 235, hw = 62;
  [-hw, hw].forEach(d => {
    const px = x + d - 9;
    for (let i = 0; i < 12; i++) {
      const y0 = Math.max(top, GY - (i + 1) * 20), h = GY - i * 20 - y0;
      if (h > 0) { ctx.fillStyle = i % 2 ? '#fff' : '#ff6b6b'; ctx.fillRect(px, y0, 18, h); }
    }
    rr(px, top, 18, 235, 4); stroke(4);
  });
  ctx.fillStyle = '#ffd93d'; rr(x - hw - 14, top - 6, hw * 2 + 28, 42, 10); ctx.fill(); stroke(4);
  ctx.fillStyle = INK; ctx.font = '700 20px "Comic Sans MS",system-ui,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('CHECKPOINT', x, top + 22);
  for (let i = 0; i < 14; i++) for (let j = 0; j < 2; j++) { ctx.fillStyle = (i + j) % 2 ? '#fff' : INK; ctx.fillRect(x - hw - 9 + i * 10.15, GY + 1 + j * 6.5, 10.15, 6.5); }
}

// ---------- helpers ----------
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };
const stroke = (w = 3) => { ctx.lineWidth = w; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); };

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- background ----------
function drawSky(n) {
  const g = ctx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, mix('#4fb3ff', '#0f1538', n));
  g.addColorStop(1, mix('#d9f3ff', '#3b4080', n));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // stars
  if (n > 0.15) {
    ctx.fillStyle = `rgba(255,255,220,${(n - 0.15)})`;
    for (let i = 0; i < 40; i++) {
      const sx = (i * 97) % W, sy = (i * 53) % 190, r = 1 + (i % 3) * 0.7;
      ctx.globalAlpha = (n - 0.15) * (0.6 + 0.4 * Math.sin(t * 0.05 + i));
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // sun & moon swing across the sky
  const a = cycle;                       // 0..2PI
  const sunX = W / 2 + Math.cos(a) * 380, sunY = 330 - Math.sin(a) * 270;
  const moonX = W / 2 + Math.cos(a + Math.PI) * 380, moonY = 330 - Math.sin(a + Math.PI) * 270;
  // sun
  ctx.fillStyle = '#ffd93d'; ctx.beginPath(); ctx.arc(sunX, sunY, 34, 0, 7); ctx.fill(); stroke(4);
  // moon
  ctx.fillStyle = '#f4f1de'; ctx.beginPath(); ctx.arc(moonX, moonY, 30, 0, 7); ctx.fill(); stroke(4);
  ctx.fillStyle = '#d6d2b8';
  [[-8, -6, 6], [9, 4, 8], [-4, 12, 4]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(moonX + dx, moonY + dy, r, 0, 7); ctx.fill(); });
}

function drawClouds(n) {
  ctx.fillStyle = mix('#ffffff', '#6a6fa8', n);
  clouds.forEach(c => {
    c.x -= speed * 0.15; if (c.x < -120) { c.x = W + 60; c.y = 30 + Math.random() * 100; }
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.arc(26, -10, 28, 0, 7); ctx.arc(56, 0, 22, 0, 7); ctx.rect(0, 0, 56, 22);
    ctx.fill(); ctx.restore();
  });
}

function mountains(offset, baseY, hs, wd, base, snow, n) {
  const period = hs.length * wd;
  const off = offset % period;
  ctx.fillStyle = mix(base[0], base[1], n);
  for (let rep = -1; rep < Math.ceil(W / period) + 1; rep++) {
    hs.forEach((h, i) => {
      const x = rep * period + i * wd - off;
      if (x > W + wd || x < -wd * 2) return;
      ctx.beginPath(); ctx.moveTo(x - wd * 0.2, baseY); ctx.lineTo(x + wd / 2, baseY - h); ctx.lineTo(x + wd * 1.2, baseY); ctx.closePath();
      ctx.fillStyle = mix(base[0], base[1], n); ctx.fill(); stroke(3);
      if (snow) { // snow cap
        const cx = x + wd / 2, cy = baseY - h, k = 0.28;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + wd * 0.7 * k, cy + h * k);
        ctx.lineTo(cx + wd * 0.2 * k, cy + h * k * 0.75);
        ctx.lineTo(cx, cy + h * k * 1.05);
        ctx.lineTo(cx - wd * 0.3 * k, cy + h * k * 0.75);
        ctx.lineTo(cx - wd * 0.7 * k, cy + h * k);
        ctx.closePath(); ctx.fillStyle = mix('#ffffff', '#b9bfe6', n); ctx.fill(); stroke(2);
      }
    });
  }
}

function drawGround(n) {
  ctx.fillStyle = mix('#7bd96b', '#2d6a4f', n); ctx.fillRect(0, GY, W, 14); 
  ctx.fillStyle = mix('#e0b27a', '#6b4f3a', n); ctx.fillRect(0, GY + 14, W, H - GY - 14);
  ctx.beginPath(); ctx.moveTo(0, GY); ctx.lineTo(W, GY); stroke(4);
  ctx.fillStyle = mix('#c99a62', '#54402f', n);
  for (let i = 0; i < 22; i++) {
    const x = ((i * 70 - groundX) % (W + 70) + W + 70) % (W + 70) - 35;
    ctx.beginPath(); ctx.ellipse(x, GY + 34 + (i % 3) * 14, 10 + (i % 4) * 2, 4, 0, 0, 7); ctx.fill();
  }
}

// ---------- obstacles ----------
function spawn() {
  const r = Math.random();
  if (r < 0.5) {
    const h = 50 + Math.random() * 35; obstacles.push({ type: 'cactus', x: W + 20, w: 34, h });
  } else if (r < 0.8) {
    const h = 55 + Math.random() * 20; obstacles.push({ type: 'cactus2', x: W + 20, w: 70, h });
  } else {
    obstacles.push({ type: 'rock', x: W + 20, w: 54, h: 42 });
  }
}

function cactus(x, y, w, h) {
  ctx.fillStyle = '#4cc36b';
  rr(x + w / 2 - 9, y, 18, h, 9); ctx.fill(); stroke();
  rr(x - 2, y + h * 0.35, 14, 10, 5); ctx.fill(); stroke();
  rr(x - 2, y + h * 0.2, 10, h * 0.25, 5); ctx.fill(); stroke();
  rr(x + w - 12, y + h * 0.5, 14, 10, 5); ctx.fill(); stroke();
  rr(x + w - 8, y + h * 0.3, 10, h * 0.28, 5); ctx.fill(); stroke();
  rr(x + w / 2 - 9, y, 18, h, 9); ctx.fill();
  ctx.fillStyle = '#2f8f4a'; ctx.fillRect(x + w / 2 + 2, y + 8, 3, h - 16);
}

function drawObstacle(o) {
  const y = GY - o.h;
  if (o.type === 'cactus') cactus(o.x, y, o.w, o.h);
  else if (o.type === 'cactus2') { cactus(o.x, y, 34, o.h); cactus(o.x + 36, GY - o.h * 0.8, 34, o.h * 0.8); }
  else {
    ctx.fillStyle = '#9aa0b5'; ctx.beginPath();
    ctx.moveTo(o.x, GY); ctx.lineTo(o.x + 6, y + 14); ctx.lineTo(o.x + 22, y); ctx.lineTo(o.x + 42, y + 8);
    ctx.lineTo(o.x + o.w, GY); ctx.closePath(); ctx.fill(); stroke(4);
    ctx.fillStyle = '#bfc4d6'; ctx.beginPath(); ctx.moveTo(o.x + 14, y + 18); ctx.lineTo(o.x + 22, y + 6); ctx.lineTo(o.x + 32, y + 14); ctx.closePath(); ctx.fill();
  }
}

// ---------- player ----------
function drawPlayer() {
  const squash = P.onGround ? 1 + Math.sin(t * 0.5) * 0.03 : 0.94;
  ctx.save();
  ctx.translate(P.x + P.w / 2, P.y + P.h);
  ctx.rotate(P.onGround ? 0 : Math.max(-0.25, Math.min(0.25, P.vy * 0.02)));
  ctx.scale(1 / squash, squash);
  ctx.translate(-P.w / 2, -P.h);
  if (imgOK) ctx.drawImage(img, 0, 0, P.w, P.h);
  else { // fallback cartoon blob until you set an image
    ctx.fillStyle = '#ff9f43'; rr(0, 0, P.w, P.h, 22); ctx.fill(); stroke(4);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(40, 22, 10, 0, 7); ctx.arc(20, 22, 8, 0, 7); ctx.fill();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(43, 23, 4, 0, 7); ctx.arc(22, 23, 3.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(32, 42, 8, 0.1, Math.PI - 0.1); stroke(3);
  }
  ctx.restore();
  // shadow
  const sh = Math.max(0.4, 1 - (GY - P.h - P.y) / 200);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(P.x + P.w / 2, GY + 4, 28 * sh, 6 * sh, 0, 0, 7); ctx.fill();
}

// ---------- loop ----------
function hit(o) {
  const m = 10; // forgiving hitbox
  const ax = P.x + m, ay = P.y + m, aw = P.w - m * 2, ah = P.h - m * 2;
  const bx = o.x + 4, by = GY - o.h + 4, bw = o.w - 8, bh = o.h - 4;
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function update() {
  t++;
  cycle += state === 'play' ? 0.004 : 0.0015;
  groundX += speed || 3; stepFx();
  if (state !== 'play') return;

  const prev = score; speed += 0.0025; score += speed * 0.05;
  if (Math.floor(score / 100) > Math.floor(prev / 100)) sfxBlip();
  checkScore();
  P.vy += 0.85; P.y += P.vy;
  if (P.y >= GY - P.h) { P.y = GY - P.h; P.vy = 0; P.onGround = true; }

  // checkpoint gate = your previous best distance
  const cx = P.x + P.w / 2, rem = (runCP - score) * 20;
  if (runCP >= 60 && !gate && !gatePassed && rem <= W + 80 - cx) gate = { x: cx + rem };
  if (gate) { gate.x -= speed; if (gate.x <= cx) { gate = null; gatePassed = true; celebrate(cx); } }

  nextGap--;
  const nearGate = runCP >= 60 && !gatePassed && Math.abs(rem - (W + 20 - cx)) < 180;  // keep the gate zone obstacle-free
  if (nextGap <= 0) { if (nearGate) nextGap = 8; else { spawn(); nextGap = Math.max(45, 95 - speed * 3) + Math.random() * 70; } }
  obstacles.forEach(o => o.x -= speed);
  obstacles.forEach(o => { if (!o.done && o.x + o.w < P.x) { o.done = true; if (++dodged >= 15) unlock('dodge15'); } });
  obstacles = obstacles.filter(o => o.x > -100);

  if (obstacles.some(hit)) {
    state = 'over'; sfxLose();
    const fs = Math.floor(score);
    newRec = fs > hi;
    if (newRec) { hi = fs; try { localStorage.setItem('runnerHi', hi); } catch (e) {} }   // new checkpoint saved
    if (fs < 10) unlock('oops');
  }
}

function text(s, x, y, size, color = '#fff') {
  ctx.font = `700 ${size}px "Comic Sans MS","Chalkboard SE",system-ui,sans-serif`; ctx.textAlign = 'center';
  ctx.lineWidth = Math.max(4, size / 5); ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

function draw() {
  const n = Math.min(1, Math.max(0, 0.5 - Math.sin(cycle) * 0.9)); // 0 = day, 1 = night
  drawSky(n); drawClouds(n);
  mountains(groundX * 0.08, GY, [150, 110, 170, 120], 170, ['#8fa8d8', '#3a3f7a'], true, n);
  mountains(groundX * 0.2, GY, [90, 130, 80, 110, 70], 130, ['#6bbf8a', '#24523f'], false, n);
  drawGround(n);
  gate && drawGate(gate);
  obstacles && obstacles.forEach(drawObstacle);
  drawPlayer(); drawFx();

  ctx.textAlign = 'right'; ctx.font = '700 22px "Comic Sans MS",system-ui,sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = INK;
  const s = `HI ${String(Math.floor(hi)).padStart(5, '0')}   ${String(Math.floor(score || 0)).padStart(5, '0')}`;
  ctx.strokeText(s, W - 20, 36); ctx.fillStyle = '#fff'; ctx.fillText(s, W - 20, 36);

  if (state === 'ready') {
    text('CARTOON RUNNER', W / 2, 140, 46, '#ffd93d');
    if (hi >= 60) text('Checkpoint gate waits at ' + hi, W / 2, 182, 22, '#ffd93d');
    text('Press JUMP to start', W / 2, 225, 24);
    text('🏆 ' + Object.keys(got).length + '/' + Object.keys(ACH).length + ' achievements', W / 2, 262, 20);
  }
  if (state === 'over') {
    text('GAME OVER', W / 2, 140, 54, '#ff6b6b');
    text(newRec ? 'NEW RECORD! Checkpoint saved at ' + hi : 'Checkpoint stays at ' + hi, W / 2, 185, 24, '#ffd93d');
    text('Press JUMP to retry', W / 2, 228, 24);
  }
}

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
